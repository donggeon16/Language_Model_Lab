[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "language-model-lab"
version = "0.1.0"
description = "Language model architectures, post-training, and efficient inference"
requires-python = ">=3.11"
dependencies = ["numpy", "torch", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
post-training = ["transformers", "datasets", "peft", "trl", "accelerate"]
quantization = ["torchao", "bitsandbytes"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
